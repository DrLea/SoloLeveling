<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>The System</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=10">
<script src="config.js?v=10"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div id="bg"></div>

<!-- LOCK SCREEN -->
<section id="lock" class="screen">
  <div class="sys-window lock-box">
    <div class="sys-head"><span class="sys-icon">!</span> NOTIFICATION</div>
    <div id="lockBody"></div>
  </div>
</section>

<!-- APP -->
<section id="app" class="screen hidden">
  <header class="topbar">
    <div class="brand">THE SYSTEM</div>
    <div class="top-right">
      <span id="lvlChip" class="chip-lvl"></span>
      <span id="goldChip" class="chip-gold"></span>
      <button id="syncBtn" class="sync-btn" title="Sync with Google Drive"></button>
    </div>
  </header>
  <main id="view"></main>
  <nav class="bottomnav">
    <button data-tab="quests"><span class="ni">◈</span><span>Quests</span></button>
    <button data-tab="tasks"><span class="ni">☰</span><span>Tasks</span></button>
    <button data-tab="status"><span class="ni">◉</span><span>Status</span></button>
    <button data-tab="log"><span class="ni">▦</span><span>Record</span></button>
    <button data-tab="shop"><span class="ni">◆</span><span>Shop</span></button>
    <button data-tab="settings"><span class="ni">⚙</span><span>System</span></button>
  </nav>
</section>

<div id="modal" class="modal hidden"><div class="sys-window modal-box" id="modalBox"></div></div>
<div id="popups"></div>
<div id="toast" class="toast hidden"></div>

<script src="app.js?v=10"></script>
</body>
</html>
